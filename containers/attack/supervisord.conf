[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/lab-supervisord.pid

[program:dbus]
command=/usr/bin/dbus-daemon --system --nofork --nopidfile
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:sshd]
command=/usr/sbin/sshd -D -e
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:xrdp-sesman]
command=/usr/sbin/xrdp-sesman --nodaemon
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:xrdp]
command=/usr/sbin/xrdp --nodaemon
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:vnc]
command=/usr/bin/tigervncserver :1 -fg -localhost no -interface 10.0.0.20 -SecurityTypes VncAuth,TLSVnc -PasswordFile /run/arp-lab-vnc/passwd -geometry 1280x800 -depth 24 -AlwaysShared -xstartup /home/student/.xsession
user=student
environment=HOME="/home/student",USER="student",LOGNAME="student"
directory=/home/student
autorestart=true
stopasgroup=true
killasgroup=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:novnc]
command=/usr/bin/websockify --web=/usr/share/novnc 10.0.0.20:6080 10.0.0.20:5901
user=student
autorestart=true
stopasgroup=true
killasgroup=true
priority=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
