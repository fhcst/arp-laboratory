name: Images

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-compose-action@54042514f505b273907334ae2b9cdbb9a0213c1a # v2.4.0
      - name: Check Compose modes and teaching artifacts
        run: python3 scripts/validate-project.py
      - name: Check shell syntax
        run: find containers scripts -name '*.sh' -print0 | xargs -0 -n 1 bash -n

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-compose-action@54042514f505b273907334ae2b9cdbb9a0213c1a # v2.4.0
      - uses: docker/setup-docker-action@3f1ab1ab0e29231562e4db4ca600c1a49653bac6 # v5.7.0
        with:
          version: latest
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Configure native architecture tags
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="sha-${GITHUB_SHA}-${ARCH}"
          echo "IMAGE_PREFIX=$prefix" >> "$GITHUB_ENV"
          echo "LAB_IMAGE_PREFIX=$prefix" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$tag" >> "$GITHUB_ENV"
          echo "LAB_IMAGE_TAG=$tag" >> "$GITHUB_ENV"
          echo "SOURCE_REVISION=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "PLATFORMS=linux/$ARCH" >> "$GITHUB_ENV"
      - name: Build all five images
        run: docker buildx bake --load
      - name: Test the native lab
        env:
          LAB_INTERVAL: "2"
        run: bash scripts/smoke-test.sh
      - name: Sign in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified architecture images
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          for component in router access server victim attack; do
            docker push "${IMAGE_PREFIX}-${component}:${IMAGE_TAG}"
          done

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-architecture manifests
        run: |
          prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          for component in router access server victim attack; do
            image="${prefix}-${component}"
            docker buildx imagetools create \
              --tag "$image:latest" --tag "$image:sha-$GITHUB_SHA" \
              "$image:sha-$GITHUB_SHA-amd64" "$image:sha-$GITHUB_SHA-arm64"
            docker buildx imagetools inspect "$image:sha-$GITHUB_SHA"
          done
