<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">ARP Laboratory</title>
  <desc id="desc">An isolated network lab connecting a victim and attacker through a router to an HTTP server.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1c30"/><stop offset="1" stop-color="#143842"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#87c3c0" stroke-opacity=".06"/></pattern>
  </defs>
  <rect width="1280" height="420" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="24" fill="url(#grid)"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="62" y="65" fill="#74e1c9" font-size="16" font-weight="700" letter-spacing="4">FHCST / OPEN NETWORK LAB</text>
    <text x="58" y="137" fill="#f2f8fc" font-size="65" font-weight="750" letter-spacing="-2">ARP Laboratory</text>
    <text x="62" y="177" fill="#b6ccd6" font-size="21">Observe the traffic. Understand the trust. Build the defense.</text>
    <g fill="none" stroke="#71cfbd" stroke-width="3">
      <path d="M226 267H566M226 349H490V267H566M726 267H1018"/>
      <circle cx="490" cy="267" r="5" fill="#71cfbd"/>
    </g>
    <g fill="#142e40" stroke="#3e6773" stroke-width="1.5">
      <rect x="62" y="235" width="164" height="64" rx="12"/>
      <rect x="62" y="317" width="164" height="64" rx="12"/>
      <rect x="566" y="224" width="160" height="86" rx="12"/>
      <rect x="1018" y="224" width="200" height="86" rx="12"/>
    </g>
    <g fill="#f2f8fc" font-size="21" text-anchor="middle" font-weight="600">
      <text x="144" y="274">Victim</text><text x="144" y="356">Attacker</text>
      <text x="646" y="259">Router</text><text x="1118" y="259">HTTP Server</text>
    </g>
    <g fill="#95b6c5" font-size="15" text-anchor="middle">
      <text x="646" y="286">forward + record</text><text x="1118" y="286">Apache + PHP</text>
      <text x="390" y="245">10.0.0.0/16</text><text x="871" y="245">203.72.59.0/24</text>
    </g>
    <text x="1217" y="380" fill="#74e1c9" font-size="14" text-anchor="end" letter-spacing="2">DOCKER COMPOSE · AMD64 + ARM64</text>
  </g>
</svg>
